<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器 — MiniTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:           #0f0f10;
            --surface:      #18181b;
            --surface-2:    #1f1f23;
            --border:       #27272a;
            --border-2:     #3f3f46;
            --text:         #fafafa;
            --muted:        #a1a1aa;
            --dim:          #71717a;
            --accent:       #f59e0b;
            --accent-bg:    rgba(245, 158, 11, 0.1);
            --accent-bdr:   rgba(245, 158, 11, 0.3);
            --success-bg:   rgba(34, 197, 94, 0.08);
            --success-bdr:  rgba(34, 197, 94, 0.2);
            --success-text: #86efac;
            --error-bg:     rgba(239, 68, 68, 0.08);
            --error-bdr:    rgba(239, 68, 68, 0.2);
            --error-text:   #fca5a5;
            --radius:       8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding: 28px 20px;
            line-height: 1.6;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 9999;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .container {
            max-width: 540px;
            margin: 0 auto;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 28px;
            font-size: 13px;
            color: var(--dim);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-btn:hover { color: var(--text); }
        .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        h1 {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .subtitle {
            font-size: 13px;
            color: var(--dim);
            margin-bottom: 32px;
        }

        .calculator {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.02em;
        }

        input[type="number"] {
            width: 100%;
            padding: 11px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="number"]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .operation-group {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .op-btn {
            padding: 12px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .op-btn span {
            font-size: 11px;
            color: var(--dim);
            font-family: 'Outfit', sans-serif;
        }

        .op-btn:hover {
            border-color: var(--border-2);
            background: var(--surface-2);
            color: var(--text);
        }

        .op-btn:active { transform: scale(0.97); }

        .op-btn.active {
            background: var(--accent-bg);
            border-color: var(--accent-bdr);
            color: var(--accent);
        }

        .op-btn.active span { color: var(--accent); }

        .calculate-btn {
            width: 100%;
            padding: 13px;
            background: var(--accent);
            color: #0f0f10;
            border: none;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s;
        }

        .calculate-btn:hover { background: #fbbf24; transform: translateY(-1px); }
        .calculate-btn:active { transform: translateY(0) scale(0.99); }
        .calculate-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .result {
            margin-top: 4px;
            border-radius: var(--radius);
            padding: 20px;
            display: none;
        }

        .result.success {
            background: var(--success-bg);
            border: 1px solid var(--success-bdr);
            display: block;
        }

        .result.error {
            background: var(--error-bg);
            border: 1px solid var(--error-bdr);
            display: block;
        }

        .result-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--success-text);
            font-family: 'JetBrains Mono', monospace;
            font-variant-numeric: tabular-nums;
            margin: 8px 0;
            letter-spacing: -0.02em;
        }

        .result.error .result-value {
            font-size: 15px;
            color: var(--error-text);
            font-family: inherit;
            font-weight: 500;
        }

        .result-expression {
            font-size: 12px;
            color: var(--dim);
            font-family: 'JetBrains Mono', monospace;
        }

        .history {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .history h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 14px;
            letter-spacing: -0.01em;
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .history-item {
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            color: var(--muted);
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.7;
        }

        .history-item strong { color: var(--text); }
        .history-item small { color: var(--dim); font-family: 'Outfit', sans-serif; }

        .clear-history {
            margin-top: 12px;
            padding: 8px 16px;
            background: transparent;
            color: var(--dim);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            cursor: pointer;
            font-family: inherit;
            font-size: 13px;
            transition: all 0.2s;
        }

        .clear-history:hover {
            border-color: var(--error-bdr);
            color: var(--error-text);
            background: var(--error-bg);
        }

    </style>
</head>
<body>
    <div class="container">
        <a href="/ui" class="back-btn">← 返回主页</a>
        <h1>计算器</h1>
        <p class="subtitle">科学计算 · 支持三角、对数与幂运算</p>
        
        <div class="calculator">
            <div class="input-group">
                <label for="numA">数字 A</label>
                <input type="number" id="numA" placeholder="请输入数字" step="any" value="10">
            </div>
            
            <div class="input-group">
                <label>基本运算</label>
                <div class="operation-group">
                    <button class="op-btn active" data-op="add" data-needs-two="true">
                        +
                        <span>加</span>
                    </button>
                    <button class="op-btn" data-op="sub" data-needs-two="true">
                        -
                        <span>减</span>
                    </button>
                    <button class="op-btn" data-op="mul" data-needs-two="true">
                        ×
                        <span>乘</span>
                    </button>
                    <button class="op-btn" data-op="div" data-needs-two="true">
                        ÷
                        <span>除</span>
                    </button>
                </div>
            </div>
            
            <div class="input-group">
                <label>科学运算</label>
                <div class="operation-group">
                    <button class="op-btn" data-op="pow" data-needs-two="true">
                        x^y
                        <span>幂</span>
                    </button>
                    <button class="op-btn" data-op="sqrt" data-needs-two="false">
                        √
                        <span>平方根</span>
                    </button>
                    <button class="op-btn" data-op="square" data-needs-two="false">
                        x²
                        <span>平方</span>
                    </button>
                    <button class="op-btn" data-op="abs" data-needs-two="false">
                        |x|
                        <span>绝对值</span>
                    </button>
                    <button class="op-btn" data-op="factorial" data-needs-two="false">
                        n!
                        <span>阶乘</span>
                    </button>
                </div>
            </div>
            
            <div class="input-group">
                <label>三角函数（角度制）</label>
                <div class="operation-group">
                    <button class="op-btn" data-op="sin" data-needs-two="false">
                        sin
                        <span>正弦</span>
                    </button>
                    <button class="op-btn" data-op="cos" data-needs-two="false">
                        cos
                        <span>余弦</span>
                    </button>
                    <button class="op-btn" data-op="tan" data-needs-two="false">
                        tan
                        <span>正切</span>
                    </button>
                </div>
            </div>
            
            <div class="input-group">
                <label>对数函数</label>
                <div class="operation-group">
                    <button class="op-btn" data-op="log" data-needs-two="false">
                        log
                        <span>常用对数</span>
                    </button>
                    <button class="op-btn" data-op="ln" data-needs-two="false">
                        ln
                        <span>自然对数</span>
                    </button>
                </div>
            </div>
            
            <div class="input-group" id="numBGroup">
                <label for="numB">数字 B</label>
                <input type="number" id="numB" placeholder="请输入第二个数字" step="any" value="5">
            </div>
            
            <button class="calculate-btn" onclick="calculate()">
                计算结果
            </button>
            
            <div id="result" class="result"></div>
        </div>
        
        <div class="history">
            <h3>计算历史</h3>
            <div id="history-list" class="history-list"></div>
            <button class="clear-history" onclick="clearHistory()">清除历史</button>
        </div>
    </div>
    
    <script>
        let selectedOperation = 'add';
        let needsTwoNumbers = true;
        let history = JSON.parse(localStorage.getItem('calcHistory') || '[]');
        
        // 获取API基础URL（使用当前页面的协议和主机）
        const API_BASE_URL = `${window.location.protocol}//${window.location.host}`;
        
        // 运算符选择
        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedOperation = this.dataset.op;
                needsTwoNumbers = this.dataset.needsTwo === 'true';
                
                // 显示或隐藏第二个数字输入框
                const numBGroup = document.getElementById('numBGroup');
                if (needsTwoNumbers) {
                    numBGroup.style.display = 'flex';
                } else {
                    numBGroup.style.display = 'none';
                }
            });
        });
        
        // 运算符选择
        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedOperation = this.dataset.op;
            });
        });
        
        // 计算函数
        async function calculate() {
            const numA = parseFloat(document.getElementById('numA').value);
            const numBInput = document.getElementById('numB');
            const numB = needsTwoNumbers ? parseFloat(numBInput.value) : null;
            const resultDiv = document.getElementById('result');
            
            // 验证输入
            if (isNaN(numA)) {
                showResult(false, '请输入有效的数字 A');
                return;
            }
            
            if (needsTwoNumbers && isNaN(numB)) {
                showResult(false, '请输入有效的数字 B');
                return;
            }
            
            try {
                const requestBody = {
                    a: numA,
                    operation: selectedOperation
                };
                
                // 只在需要时添加第二个数字
                if (needsTwoNumbers && numB !== null) {
                    requestBody.b = numB;
                }
                
                const response = await fetch(`${API_BASE_URL}/plugins/Calculator/execute`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showResult(true, data.data.result, data.data.expression);
                    addToHistory(data.data.expression);
                } else {
                    showResult(false, data.message);
                }
            } catch (error) {
                showResult(false, '连接服务器失败: ' + error.message);
            }
        }
        
        // 显示结果
        function showResult(success, message, expression = '') {
            const resultDiv = document.getElementById('result');
            resultDiv.className = 'result ' + (success ? 'success' : 'error');
            
            if (success) {
                resultDiv.innerHTML = `
                    <div class="result-expression">${expression}</div>
                    <div class="result-value">${message}</div>
                `;
            } else {
                resultDiv.innerHTML = `<div>${message}</div>`;
            }
        }
        
        // 添加到历史记录
        function addToHistory(expression) {
            history.unshift({
                expression: expression,
                time: new Date().toLocaleString('zh-CN')
            });
            
            if (history.length > 10) {
                history = history.slice(0, 10);
            }
            
            localStorage.setItem('calcHistory', JSON.stringify(history));
            renderHistory();
        }
        
        // 渲染历史记录
        function renderHistory() {
            const historyList = document.getElementById('history-list');
            
            if (history.length === 0) {
                historyList.innerHTML = '<div class="history-item">暂无计算历史</div>';
                return;
            }
            
            historyList.innerHTML = history.map(item => 
                `<div class="history-item">
                    <strong>${item.expression}</strong><br>
                    <small>${item.time}</small>
                </div>`
            ).join('');
        }
        
        // 清除历史
        function clearHistory() {
            if (confirm('确定要清除所有历史记录吗？')) {
                history = [];
                localStorage.removeItem('calcHistory');
                renderHistory();
            }
        }
        
        // 键盘回车支持
        document.getElementById('numA').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') calculate();
        });
        
        document.getElementById('numB').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') calculate();
        });
        
        // 初始化历史记录
        renderHistory();
    </script>
</body>
</html>
