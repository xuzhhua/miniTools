<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文本处理 — MiniTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f10; --surface: #18181b; --surface-2: #1f1f23;
            --border: #27272a; --border-2: #3f3f46;
            --text: #fafafa; --muted: #a1a1aa; --dim: #71717a;
            --accent: #f59e0b; --accent-bg: rgba(245,158,11,0.1); --accent-bdr: rgba(245,158,11,0.3);
            --success-bg: rgba(34,197,94,0.08); --success-bdr: rgba(34,197,94,0.2); --success-text: #86efac;
            --error-bg: rgba(239,68,68,0.08); --error-bdr: rgba(239,68,68,0.2); --error-text: #fca5a5;
            --radius: 8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100dvh;
            padding: 28px 20px;
            line-height: 1.6;
        }

        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .container { max-width: 860px; margin: 0 auto; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin-bottom: 28px; font-size: 13px; color: var(--dim);
            text-decoration: none; transition: color 0.2s;
        }
        .back-btn:hover { color: var(--text); }
        .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: var(--dim); margin-bottom: 32px; }

        .input-group { margin-bottom: 20px; }

        label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--muted); letter-spacing: 0.02em; margin-bottom: 8px;
        }

        textarea {
            width: 100%; min-height: 150px; padding: 13px 14px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); font-family: 'JetBrains Mono', monospace;
            font-size: 14px; color: var(--text); resize: vertical; outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

        .operations {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 8px; margin-bottom: 20px;
        }

        .op-btn {
            padding: 12px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
            font-family: inherit; font-size: 14px; font-weight: 500; text-align: center;
            color: var(--muted);
        }
        .op-btn:hover { border-color: var(--border-2); background: var(--surface-2); color: var(--text); }
        .op-btn:active { transform: scale(0.98); }
        .op-btn.active { background: var(--accent-bg); border-color: var(--accent-bdr); color: var(--accent); font-weight: 600; }

        .process-btn {
            width: 100%; padding: 13px; background: var(--accent); color: #0f0f10;
            border: none; border-radius: var(--radius); font-family: inherit;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background 0.2s, transform 0.15s; margin-bottom: 20px;
        }
        .process-btn:hover { background: #fbbf24; transform: translateY(-1px); }
        .process-btn:active { transform: translateY(0) scale(0.99); }
        .process-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .result { display: none; }
        .result.show { display: block; }

        .result-box {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
        }

        .result-content {
            font-family: 'JetBrains Mono', monospace; font-size: 14px;
            line-height: 1.7; color: var(--text); white-space: pre-wrap; word-break: break-all;
        }

        .stats-box {
            background: var(--surface-2); border-left: 3px solid var(--accent);
            padding: 13px 16px; border-radius: 0 var(--radius) var(--radius) 0; margin-top: 14px;
        }

        .stats-item {
            display: inline-block; margin-right: 20px;
            color: var(--muted); font-size: 13px;
        }
        .stats-item strong { color: var(--text); font-family: 'JetBrains Mono', monospace; }

        .action-btns { display: flex; gap: 8px; margin-top: 14px; }

        .copy-btn, .clear-btn {
            padding: 9px 18px; border: none; border-radius: var(--radius);
            cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 500;
            transition: all 0.2s;
        }
        .copy-btn { background: var(--accent); color: #0f0f10; }
        .copy-btn:hover { background: #fbbf24; }
        .copy-btn.copied { background: rgba(34,197,94,0.15); color: var(--success-text); border: 1px solid var(--success-bdr); }

        .clear-btn { background: var(--surface-2); color: var(--muted); border: 1px solid var(--border); }
        .clear-btn:hover { border-color: var(--error-bdr); color: var(--error-text); background: var(--error-bg); }

        .error-message {
            background: var(--error-bg);
            border: 1px solid var(--error-bdr);
            color: var(--error-text);
            padding: 14px 16px;
            border-radius: var(--radius);
        }

    </style>
</head>
<body>
    <div class="container">
        <a href="/ui" class="back-btn">← 返回主页</a>
        
        <h1>文本处理</h1>
        <p class="subtitle">大小写转换 · 文本反转 · 字数统计</p>
        
        <div class="input-group">
            <label for="textInput">输入文本</label>
            <textarea id="textInput" placeholder="请输入要处理的文本...">Hello World</textarea>
        </div>
        
        <label>选择操作</label>
        <div class="operations">
            <button class="op-btn active" data-op="uppercase">转大写</button>
            <button class="op-btn" data-op="lowercase">转小写</button>
            <button class="op-btn" data-op="reverse">文本反转</button>
            <button class="op-btn" data-op="count">统计信息</button>
        </div>
        
        <button class="process-btn" onclick="processText()">处理文本</button>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        let selectedOperation = 'uppercase';
        const API_BASE_URL = `${window.location.protocol}//${window.location.host}`;
        
        // 操作选择
        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedOperation = this.dataset.op;
            });
        });
        
        // 处理文本
        async function processText() {
            const text = document.getElementById('textInput').value;
            const resultDiv = document.getElementById('result');
            
            if (!text.trim()) {
                resultDiv.innerHTML = '<div class="error-message">请输入文本内容</div>';
                resultDiv.classList.add('show');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/plugins/TextTool/execute`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: text,
                        operation: selectedOperation
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayResult(data.data);
                } else {
                    resultDiv.innerHTML = `<div class="error-message">${data.message}</div>`;
                    resultDiv.classList.add('show');
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error-message">连接服务器失败: ${error.message}</div>`;
                resultDiv.classList.add('show');
            }
        }
        
        // 显示结果
        function displayResult(data) {
            const resultDiv = document.getElementById('result');
            let html = '';
            
            if (typeof data === 'object' && data.length !== undefined) {
                // 统计信息
                html = `
                    <div class="result-box">
                        <h3 style="color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 12px; letter-spacing: 0.02em; text-transform: uppercase;">统计结果</h3>
                        <div class="stats-box">
                            <div class="stats-item"><strong>总字符数:</strong> ${data.length}</div>
                            <div class="stats-item"><strong>总词数:</strong> ${data.words}</div>
                            <div class="stats-item"><strong>总行数:</strong> ${data.lines}</div>
                        </div>
                    </div>
                `;
            } else {
                // 文本处理结果
                html = `
                    <div class="result-box">
                        <h3 style="color: var(--muted); font-size: 13px; font-weight: 600; margin-bottom: 12px; letter-spacing: 0.02em; text-transform: uppercase;">处理结果</h3>
                        <div class="result-content">${escapeHtml(String(data))}</div>
                        <div class="action-btns">
                            <button class="copy-btn" onclick="copyResult()">📋 复制结果</button>
                            <button class="clear-btn" onclick="clearResult()">🗑️ 清除</button>
                        </div>
                    </div>
                `;
            }
            
            resultDiv.innerHTML = html;
            resultDiv.classList.add('show');
            
            // 保存结果用于复制
            window.currentResult = data;
        }
        
        // 复制结果
        function copyResult() {
            const text = typeof window.currentResult === 'object' 
                ? JSON.stringify(window.currentResult, null, 2)
                : String(window.currentResult);
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ 已复制';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('复制失败: ' + err);
            });
        }
        
        // 清除结果
        function clearResult() {
            const resultDiv = document.getElementById('result');
            resultDiv.classList.remove('show');
            window.currentResult = null;
        }
        
        // HTML转义
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        // 回车键处理
        document.getElementById('textInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                processText();
            }
        });
    </script>
</body>
</html>
