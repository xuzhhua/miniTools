<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化 — MiniTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f10; --surface: #18181b; --surface-2: #1f1f23;
            --border: #27272a; --border-2: #3f3f46;
            --text: #fafafa; --muted: #a1a1aa; --dim: #71717a;
            --accent: #f59e0b; --accent-bg: rgba(245,158,11,0.1); --accent-bdr: rgba(245,158,11,0.3);
            --success-bg: rgba(34,197,94,0.08); --success-bdr: rgba(34,197,94,0.2); --success-text: #86efac;
            --error-bg: rgba(239,68,68,0.08); --error-bdr: rgba(239,68,68,0.2); --error-text: #fca5a5;
            --radius: 8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100dvh; padding: 28px 20px; line-height: 1.6;
        }

        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .container { max-width: 1200px; margin: 0 auto; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin-bottom: 28px; font-size: 13px; color: var(--dim);
            text-decoration: none; transition: color 0.2s;
        }
        .back-btn:hover { color: var(--text); }
        .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: var(--dim); margin-bottom: 20px; }

        label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--muted); letter-spacing: 0.02em; margin-bottom: 6px;
        }

        input[type="number"], input[type="text"] {
            padding: 9px 12px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); font-family: inherit;
            font-size: 13px; color: var(--text); outline: none;
            transition: border-color 0.2s, box-shadow 0.2s; width: 80px;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
        input[type="checkbox"] { accent-color: var(--accent); cursor: pointer; }

        .controls {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap; margin-bottom: 16px;
        }

        .operations {
            display: flex; gap: 6px;
        }

        .op-btn {
            padding: 10px 18px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
            font-family: inherit; font-size: 13px; font-weight: 500; color: var(--muted);
        }
        .op-btn:hover { border-color: var(--border-2); background: var(--surface-2); color: var(--text); }
        .op-btn:active { transform: scale(0.98); }
        .op-btn.active { background: var(--accent-bg); border-color: var(--accent-bdr); color: var(--accent); font-weight: 600; }

        .options {
            display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
        }

        .option-group {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: var(--muted);
        }

        .editor-container {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;
        }

        .editor-panel { display: flex; flex-direction: column; }

        .panel-header {
            background: var(--surface-2); border: 1px solid var(--border);
            border-bottom: none; padding: 10px 14px; border-radius: var(--radius) var(--radius) 0 0;
            font-size: 13px; font-weight: 500; color: var(--muted);
            display: flex; justify-content: space-between; align-items: center;
        }

        .panel-actions { display: flex; gap: 6px; }

        .small-btn {
            padding: 4px 10px; background: var(--border); border: none;
            border-radius: 4px; color: var(--muted); cursor: pointer;
            font-family: inherit; font-size: 12px; transition: all 0.2s;
        }
        .small-btn:hover { background: var(--border-2); color: var(--text); }

        textarea {
            width: 100%; min-height: 380px; padding: 14px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 0 0 var(--radius) var(--radius);
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            color: var(--text); resize: vertical; outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus { border-color: var(--accent); }

        .error-message {
            background: var(--error-bg); border: 1px solid var(--error-bdr);
            color: var(--error-text); padding: 12px 16px;
            border-radius: var(--radius); margin-bottom: 12px; font-size: 13px;
        }

        .stats {
            font-size: 12px; color: var(--dim); margin-bottom: 12px;
            font-family: 'JetBrains Mono', monospace;
        }

        @media (max-width: 768px) { .editor-container { grid-template-columns: 1fr; } }

    </style>
</head>
<body>
    <div class="container">
        <a href="/ui" class="back-btn">← 返回主页</a>
        
        <h1>JSON 格式化</h1>
        <p class="subtitle">格式化 · 压缩 · 语法验证</p>
        
        <div class="controls">
            <div class="operations">
                <button class="op-btn active" data-op="format">格式化</button>
                <button class="op-btn" data-op="compress">压缩</button>
                <button class="op-btn" data-op="validate">验证</button>
            </div>
            
            <div class="options" id="formatOptions">
                <div class="option-group">
                    <label for="indent">缩进:</label>
                    <input type="number" id="indent" min="0" max="8" value="4">
                </div>
                <div class="option-group">
                    <input type="checkbox" id="sortKeys">
                    <label for="sortKeys">排序键</label>
                </div>
            </div>
        </div>
        
        <div id="error" class="error-message" style="display: none;"></div>
        
        <div id="stats" class="stats"></div>
        
        <div class="editor-container">
            <div class="editor-panel">
                <div class="panel-header">
                    <span>输入</span>
                    <div class="panel-actions">
                        <button class="small-btn" onclick="clearInput()">清空</button>
                        <button class="small-btn" onclick="loadSample()">示例</button>
                    </div>
                </div>
                <textarea id="input" placeholder='粘贴或输入JSON数据...'></textarea>
            </div>
            
            <div class="editor-panel">
                <div class="panel-header">
                    <span>输出</span>
                    <div class="panel-actions">
                        <button class="small-btn" onclick="copyOutput()">复制</button>
                        <button class="small-btn" onclick="downloadOutput()">下载</button>
                    </div>
                </div>
                <textarea id="output" placeholder="处理结果将显示在这里..." readonly></textarea>
            </div>
        </div>
    </div>
    
    <script>
        let selectedOperation = 'format';
        const API_BASE_URL = `${window.location.protocol}//${window.location.host}`;
        
        // 操作选择
        document.querySelectorAll('.op-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.op-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedOperation = this.dataset.op;
                
                // 显示/隐藏格式化选项
                const formatOptions = document.getElementById('formatOptions');
                formatOptions.style.display = selectedOperation === 'format' ? 'flex' : 'none';
                
                // 自动处理
                processJson();
            });
        });
        
        // 输入变化时自动处理
        let debounceTimer;
        document.getElementById('input').addEventListener('input', function() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => processJson(), 500);
        });
        
        // 选项变化时自动处理
        document.getElementById('indent').addEventListener('change', processJson);
        document.getElementById('sortKeys').addEventListener('change', processJson);
        
        // 处理JSON
        async function processJson() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            const errorDiv = document.getElementById('error');
            const statsDiv = document.getElementById('stats');
            
            errorDiv.style.display = 'none';
            statsDiv.classList.remove('show');
            
            if (!input.trim()) {
                output.value = '';
                return;
            }
            
            try {
                const indent = parseInt(document.getElementById('indent').value);
                const sortKeys = document.getElementById('sortKeys').checked;
                
                const response = await fetch(`${API_BASE_URL}/plugins/JsonFormatter/execute`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        json_text: input,
                        operation: selectedOperation,
                        indent: indent,
                        sort_keys: sortKeys
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    if (selectedOperation === 'validate') {
                        output.value = JSON.stringify(data.data, null, 2);
                    } else {
                        output.value = data.data.result;
                    }
                    displayStats(data.data);
                } else {
                    showError(data.message);
                    output.value = '';
                }
            } catch (error) {
                showError('处理失败: ' + error.message);
                output.value = '';
            }
        }
        
        // 显示统计信息
        function displayStats(data) {
            const statsDiv = document.getElementById('stats');
            let html = '<div class="stats-grid">';
            
            if (data.original_size !== undefined) {
                html += `
                    <div class="stat-item">
                        <span class="stat-label">原始大小</span>
                        <span class="stat-value">${data.original_size} 字节</span>
                    </div>
                `;
            }
            
            if (data.formatted_size !== undefined) {
                html += `
                    <div class="stat-item">
                        <span class="stat-label">格式化后</span>
                        <span class="stat-value">${data.formatted_size} 字节</span>
                    </div>
                `;
            }
            
            if (data.compressed_size !== undefined) {
                html += `
                    <div class="stat-item">
                        <span class="stat-label">压缩后</span>
                        <span class="stat-value">${data.compressed_size} 字节</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">压缩率</span>
                        <span class="stat-value">${data.compression_ratio}</span>
                    </div>
                `;
            }
            
            if (data.keys_count !== undefined) {
                html += `
                    <div class="stat-item">
                        <span class="stat-label">键数量</span>
                        <span class="stat-value">${data.keys_count}</span>
                    </div>
                `;
            }
            
            if (data.depth !== undefined) {
                html += `
                    <div class="stat-item">
                        <span class="stat-label">嵌套深度</span>
                        <span class="stat-value">${data.depth}</span>
                    </div>
                `;
            }
            
            if (data.structure) {
                const structure = data.structure;
                html += `
                    <div class="stat-item">
                        <span class="stat-label">对象/数组</span>
                        <span class="stat-value">${structure.objects}/${structure.arrays}</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">字符串/数字</span>
                        <span class="stat-value">${structure.strings}/${structure.numbers}</span>
                    </div>
                `;
            }
            
            html += '</div>';
            statsDiv.innerHTML = html;
            statsDiv.classList.add('show');
        }
        
        // 显示错误
        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }
        
        // 清空输入
        function clearInput() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            document.getElementById('stats').classList.remove('show');
        }
        
        // 加载示例
        function loadSample() {
            const sample = {
                "name": "MiniTools",
                "version": "1.0.0",
                "description": "统一工具管理平台",
                "features": ["插件化", "热重载", "Web界面"],
                "plugins": [
                    {"name": "Calculator", "type": "math"},
                    {"name": "TextTool", "type": "text"},
                    {"name": "JsonFormatter", "type": "format"}
                ],
                "config": {
                    "host": "0.0.0.0",
                    "port": 18787,
                    "debug": false
                }
            };
            document.getElementById('input').value = JSON.stringify(sample);
            processJson();
        }
        
        // 复制输出
        function copyOutput() {
            const output = document.getElementById('output');
            output.select();
            navigator.clipboard.writeText(output.value).then(() => {
                alert('已复制到剪贴板');
            }).catch(err => {
                alert('复制失败: ' + err);
            });
        }
        
        // 下载输出
        function downloadOutput() {
            const output = document.getElementById('output').value;
            if (!output) {
                alert('没有可下载的内容');
                return;
            }
            
            const blob = new Blob([output], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `formatted_${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
