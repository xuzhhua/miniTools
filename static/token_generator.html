<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Token 生成器 — MiniTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f10; --surface: #18181b; --surface-2: #1f1f23;
            --border: #27272a; --border-2: #3f3f46;
            --text: #fafafa; --muted: #a1a1aa; --dim: #71717a;
            --accent: #f59e0b; --accent-bg: rgba(245,158,11,0.1); --accent-bdr: rgba(245,158,11,0.3);
            --success-bg: rgba(34,197,94,0.08); --success-bdr: rgba(34,197,94,0.2); --success-text: #86efac;
            --error-bg: rgba(239,68,68,0.08); --error-bdr: rgba(239,68,68,0.2); --error-text: #fca5a5;
            --radius: 8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100dvh; padding: 28px 20px; line-height: 1.6;
        }

        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .container { max-width: 860px; margin: 0 auto; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin-bottom: 28px; font-size: 13px; color: var(--dim);
            text-decoration: none; transition: color 0.2s;
        }
        .back-btn:hover { color: var(--text); }
        .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: var(--dim); margin-bottom: 28px; }

        label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--muted); letter-spacing: 0.02em; margin-bottom: 8px;
        }

        input[type="number"], input[type="text"] {
            width: 100%; padding: 11px 14px;
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); font-family: inherit;
            font-size: 14px; color: var(--text); outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

        .token-types {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 8px; margin-bottom: 20px;
        }

        .type-btn {
            padding: 11px 10px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
            font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: center; color: var(--muted);
        }
        .type-btn:hover { border-color: var(--border-2); background: var(--surface-2); color: var(--text); }
        .type-btn:active { transform: scale(0.98); }
        .type-btn.active { background: var(--accent-bg); border-color: var(--accent-bdr); color: var(--accent); font-weight: 600; }

        .controls {
            display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px;
        }

        .control-group { display: flex; flex-direction: column; gap: 8px; }
        .control-group.full-width { grid-column: 1 / -1; }

        .generate-btn {
            width: 100%; padding: 13px; background: var(--accent); color: #0f0f10;
            border: none; border-radius: var(--radius); font-family: inherit;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background 0.2s, transform 0.15s; margin-bottom: 20px;
        }
        .generate-btn:hover { background: #fbbf24; transform: translateY(-1px); }
        .generate-btn:active { transform: translateY(0) scale(0.99); }
        .generate-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .result { display: none; margin-bottom: 20px; }
        .result.show { display: block; }

        .token-display {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 14px; margin-bottom: 10px;
        }

        .token-text {
            font-family: 'JetBrains Mono', monospace; word-break: break-all;
            color: var(--text); font-size: 13px; line-height: 1.7; margin-bottom: 10px;
        }

        .token-actions { display: flex; gap: 8px; }

        .copy-btn, .download-btn {
            padding: 7px 14px; background: var(--accent); color: #0f0f10;
            border: none; border-radius: var(--radius); cursor: pointer;
            font-family: inherit; font-size: 13px; font-weight: 500; transition: all 0.2s;
        }
        .copy-btn:hover, .download-btn:hover { background: #fbbf24; }
        .copy-btn.copied { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-bdr); }

        .token-info {
            background: var(--surface-2); border-left: 3px solid var(--accent);
            padding: 12px 16px; border-radius: 0 var(--radius) var(--radius) 0; margin-top: 10px;
        }
        .token-info p { margin: 4px 0; color: var(--muted); font-size: 13px; }

        .description {
            background: var(--surface); border: 1px solid var(--border);
            padding: 16px; border-radius: var(--radius); margin-bottom: 20px;
        }
        .description h3 { color: var(--text); font-size: 14px; font-weight: 600; margin-bottom: 10px; letter-spacing: -0.01em; }
        .description ul { margin-left: 16px; color: var(--muted); font-size: 13px; line-height: 1.9; }
        .description strong { color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    </style>
</head>
<body>
    <div class="container">
        <a href="/ui" class="back-btn">← 返回主页</a>
        <h1>Token 生成器</h1>
        <p class="subtitle">UUID · API 密鑰 · 安全随机字符串</p>
        
        <div class="description">
            <h3>支持的Token类型：</h3>
            <ul>
                <li><strong>UUID4</strong>: 随机UUID（通用唯一识别码）</li>
                <li><strong>UUID1</strong>: 基于时间戳的UUID</li>
                <li><strong>Hex</strong>: 十六进制随机字符串</li>
                <li><strong>Base64</strong>: Base64编码的随机字符串</li>
                <li><strong>Alphanumeric</strong>: 字母数字组合</li>
                <li><strong>API Key</strong>: 带sk_前缀的API密钥格式</li>
                <li><strong>Secure</strong>: 高安全性（含特殊字符）</li>
                <li><strong>Timestamp</strong>: 时间戳+随机数组合</li>
            </ul>
        </div>
        
        <div class="control-group full-width">
            <label>选择Token类型</label>
            <div class="token-types">
                <button class="type-btn active" data-type="uuid4">UUID4</button>
                <button class="type-btn" data-type="uuid1">UUID1</button>
                <button class="type-btn" data-type="hex">Hex</button>
                <button class="type-btn" data-type="base64">Base64</button>
                <button class="type-btn" data-type="alphanumeric">Alphanumeric</button>
                <button class="type-btn" data-type="api_key">API Key</button>
                <button class="type-btn" data-type="secure">Secure</button>
                <button class="type-btn" data-type="timestamp">Timestamp</button>
            </div>
        </div>
        
        <div class="controls">
            <div class="control-group">
                <label for="length">Token长度</label>
                <input type="number" id="length" min="1" max="256" value="32" placeholder="输入长度">
            </div>
            
            <div class="control-group">
                <label for="count">生成数量</label>
                <input type="number" id="count" min="1" max="100" value="1" placeholder="输入数量">
            </div>
            
            <div class="control-group full-width">
                <label for="prefix">前缀（可选）</label>
                <input type="text" id="prefix" placeholder="例如: prod_, dev_">
            </div>
        </div>
        
        <button class="generate-btn" onclick="generateToken()">生成Token</button>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        let selectedType = 'uuid4';
        const API_BASE_URL = `${window.location.protocol}//${window.location.host}`;
        
        // Token类型选择
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedType = this.dataset.type;
                
                // UUID类型不需要长度参数
                const lengthInput = document.getElementById('length');
                if (selectedType === 'uuid4' || selectedType === 'uuid1' || selectedType === 'timestamp') {
                    lengthInput.disabled = true;
                    lengthInput.style.opacity = '0.5';
                } else {
                    lengthInput.disabled = false;
                    lengthInput.style.opacity = '1';
                }
            });
        });
        
        // 生成Token
        async function generateToken() {
            const length = parseInt(document.getElementById('length').value);
            const count = parseInt(document.getElementById('count').value);
            const prefix = document.getElementById('prefix').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch(`${API_BASE_URL}/plugins/TokenGenerator/execute`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token_type: selectedType,
                        length: length,
                        count: count,
                        prefix: prefix
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    displayTokens(data.data);
                } else {
                    resultDiv.innerHTML = `<div style="color: red; padding: 15px; background: #fee; border-radius: 10px;">${data.message}</div>`;
                    resultDiv.classList.add('show');
                }
            } catch (error) {
                resultDiv.innerHTML = `<div style="color: red; padding: 15px; background: #fee; border-radius: 10px;">连接服务器失败: ${error.message}</div>`;
                resultDiv.classList.add('show');
            }
        }
        
        // 显示生成的Token
        function displayTokens(data) {
            const resultDiv = document.getElementById('result');
            let html = '';
            
            data.tokens.forEach((token, index) => {
                html += `
                    <div class="token-display">
                        <div class="token-text">${escapeHtml(token)}</div>
                        <div class="token-actions">
                            <button class="copy-btn" onclick="copyToken('${escapeHtml(token)}', this)">📋 复制</button>
                        </div>
                    </div>
                `;
            });
            
            html += `
                <div class="token-info">
                    <p><strong>类型:</strong> ${data.type}</p>
                    <p><strong>数量:</strong> ${data.count}</p>
                    <p><strong>长度:</strong> ${data.length}</p>
                </div>
            `;
            
            if (data.count > 1) {
                html += `
                    <button class="generate-btn" onclick="downloadAll()">💾 下载全部Token</button>
                `;
            }
            
            resultDiv.innerHTML = html;
            resultDiv.classList.add('show');
            
            // 保存tokens用于下载
            window.currentTokens = data.tokens;
        }
        
        // 复制Token
        function copyToken(token, btn) {
            navigator.clipboard.writeText(token).then(() => {
                const originalText = btn.textContent;
                btn.textContent = '✓ 已复制';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('复制失败: ' + err);
            });
        }
        
        // 下载全部Token
        function downloadAll() {
            if (!window.currentTokens || window.currentTokens.length === 0) return;
            
            const content = window.currentTokens.join('\n');
            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tokens_${Date.now()}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }
        
        // HTML转义
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        // 初始化长度输入状态
        const lengthInput = document.getElementById('length');
        lengthInput.disabled = true;
        lengthInput.style.opacity = '0.5';
    </script>
</body>
</html>
