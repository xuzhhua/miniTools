<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系统信息 — MiniTools</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f10; --surface: #18181b; --surface-2: #1f1f23;
            --border: #27272a; --border-2: #3f3f46;
            --text: #fafafa; --muted: #a1a1aa; --dim: #71717a;
            --accent: #f59e0b; --accent-bg: rgba(245,158,11,0.1); --accent-bdr: rgba(245,158,11,0.3);
            --success-bg: rgba(34,197,94,0.08); --success-bdr: rgba(34,197,94,0.2); --success-text: #86efac;
            --error-bg: rgba(239,68,68,0.08); --error-bdr: rgba(239,68,68,0.2); --error-text: #fca5a5;
            --radius: 8px;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Outfit', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100dvh; padding: 28px 20px; line-height: 1.6;
        }

        body::after {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999; opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        .container { max-width: 860px; margin: 0 auto; }

        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            margin-bottom: 28px; font-size: 13px; color: var(--dim);
            text-decoration: none; transition: color 0.2s;
        }
        .back-btn:hover { color: var(--text); }
        .back-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
        .subtitle { font-size: 13px; color: var(--dim); margin-bottom: 28px; }

        label {
            display: block; font-size: 12px; font-weight: 500;
            color: var(--muted); letter-spacing: 0.02em; margin-bottom: 8px;
        }

        .info-type-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 8px; margin-bottom: 20px;
        }

        .type-btn {
            padding: 11px; background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); cursor: pointer; transition: all 0.2s;
            font-family: inherit; font-size: 13px; font-weight: 500; text-align: center;
            color: var(--muted);
        }
        .type-btn:hover { border-color: var(--border-2); background: var(--surface-2); color: var(--text); }
        .type-btn:active { transform: scale(0.98); }
        .type-btn.active { background: var(--accent-bg); border-color: var(--accent-bdr); color: var(--accent); font-weight: 600; }

        .get-info-btn {
            width: 100%; padding: 13px; background: var(--accent); color: #0f0f10;
            border: none; border-radius: var(--radius); font-family: inherit;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: background 0.2s, transform 0.15s; margin-bottom: 20px;
        }
        .get-info-btn:hover { background: #fbbf24; transform: translateY(-1px); }
        .get-info-btn:active { transform: translateY(0) scale(0.99); }
        .get-info-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .result {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 20px; display: none;
        }
        .result.show { display: block; }

        .info-table { width: 100%; border-collapse: collapse; }
        .info-table tr { border-bottom: 1px solid var(--border); }
        .info-table tr:last-child { border-bottom: none; }
        .info-table th {
            text-align: left; padding: 10px 14px; font-size: 12px;
            font-weight: 500; color: var(--dim); width: 35%; letter-spacing: 0.02em;
        }
        .info-table td {
            padding: 10px 14px; font-size: 13px; color: var(--text);
            font-family: 'JetBrains Mono', monospace;
        }

        .section-title {
            font-size: 13px; font-weight: 600; color: var(--accent);
            letter-spacing: 0.04em; text-transform: uppercase;
            margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
        }

        .error-message {
            background: var(--error-bg); border: 1px solid var(--error-bdr);
            color: var(--error-text); padding: 14px 16px; border-radius: var(--radius);
        }

        .info-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px; color: var(--text);
        }

        .info-item {
            display: flex; justify-content: space-between; align-items: flex-start;
            padding: 10px 0; border-bottom: 1px solid var(--border); gap: 16px;
        }
        .info-item:last-child { border-bottom: none; }
        .info-key { font-size: 13px; color: var(--muted); min-width: 160px; }
        .info-val { font-size: 13px; color: var(--text); font-family: 'JetBrains Mono', monospace; text-align: right; word-break: break-all; }

    </style>
</head>
<body>
    <div class="container">
        <a href="/ui" class="back-btn">← 返回主页</a>
        
        <h1>系统信息</h1>
        <p class="subtitle">浏览器、硬件、屏幕与网络信息</p>
        
        <div class="info-type-group">
            <button class="type-btn active" data-type="all">全部信息</button>
            <button class="type-btn" data-type="browser">浏览器</button>
            <button class="type-btn" data-type="hardware">硬件</button>
            <button class="type-btn" data-type="screen">屏幕</button>
            <button class="type-btn" data-type="network">网络</button>
        </div>
        
        <button class="get-info-btn" onclick="getSystemInfo()">获取系统信息</button>
        
        <div id="result" class="result"></div>
    </div>
    
    <script>
        let selectedType = 'all';
        
        // 信息类型选择
        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                selectedType = this.dataset.type;
                
                // 自动获取信息
                getSystemInfo();
            });
        });
        
        // 获取客户端系统信息
        async function getSystemInfo() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="loading">正在获取客户端信息...</div>';
            resultDiv.classList.add('show');
            
            try {
                const data = await collectClientInfo();
                displayInfo(data);
            } catch (error) {
                resultDiv.innerHTML = `<div class="error-message">获取客户端信息失败: ${error.message}</div>`;
            }
        }
        
        // 收集客户端信息
        async function collectClientInfo() {
            const info = {};
            
            // 浏览器信息
            if (selectedType === 'all' || selectedType === 'browser') {
                info.browser = {
                    userAgent: navigator.userAgent,
                    name: getBrowserName(),
                    version: getBrowserVersion(),
                    language: navigator.language,
                    languages: navigator.languages.join(', '),
                    platform: navigator.platform,
                    cookieEnabled: navigator.cookieEnabled ? '是' : '否',
                    onLine: navigator.onLine ? '在线' : '离线',
                    doNotTrack: navigator.doNotTrack || '未设置'
                };
            }
            
            // 硬件信息
            if (selectedType === 'all' || selectedType === 'hardware') {
                info.hardware = {
                    cpuCores: navigator.hardwareConcurrency || '未知',
                    deviceMemory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : '不可用',
                    maxTouchPoints: navigator.maxTouchPoints,
                    touchSupport: navigator.maxTouchPoints > 0 ? '支持' : '不支持'
                };
            }
            
            // 屏幕信息
            if (selectedType === 'all' || selectedType === 'screen') {
                info.screen = {
                    resolution: `${screen.width} x ${screen.height}`,
                    availableResolution: `${screen.availWidth} x ${screen.availHeight}`,
                    colorDepth: `${screen.colorDepth} 位`,
                    pixelDepth: `${screen.pixelDepth} 位`,
                    orientation: screen.orientation ? screen.orientation.type : '未知',
                    devicePixelRatio: window.devicePixelRatio,
                    viewport: `${window.innerWidth} x ${window.innerHeight}`
                };
            }
            
            // 网络信息
            if (selectedType === 'all' || selectedType === 'network') {
                info.network = {
                    onLine: navigator.onLine ? '在线' : '离线'
                };
                
                // Network Information API (如果可用)
                if (navigator.connection || navigator.mozConnection || navigator.webkitConnection) {
                    const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
                    info.network.effectiveType = conn.effectiveType || '未知';
                    info.network.downlink = conn.downlink ? `${conn.downlink} Mbps` : '未知';
                    info.network.rtt = conn.rtt ? `${conn.rtt} ms` : '未知';
                    info.network.saveData = conn.saveData ? '开启' : '关闭';
                }
                
                // 获取时区信息
                info.network.timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            }
            
            // 时间信息（所有类型都显示）
            if (selectedType === 'all' || selectedType === 'network') {
                const now = new Date();
                info.time = {
                    localTime: now.toLocaleString('zh-CN'),
                    isoTime: now.toISOString(),
                    timestamp: now.getTime(),
                    timezoneOffset: `UTC${now.getTimezoneOffset() > 0 ? '-' : '+'}${Math.abs(now.getTimezoneOffset() / 60)}`
                };
            }
            
            return info;
        }
        
        // 获取浏览器名称
        function getBrowserName() {
            const ua = navigator.userAgent;
            if (ua.includes('Edg/')) return 'Microsoft Edge';
            if (ua.includes('Chrome/') && !ua.includes('Edg/')) return 'Google Chrome';
            if (ua.includes('Firefox/')) return 'Mozilla Firefox';
            if (ua.includes('Safari/') && !ua.includes('Chrome/')) return 'Safari';
            if (ua.includes('Opera/') || ua.includes('OPR/')) return 'Opera';
            return '未知浏览器';
        }
        
        // 获取浏览器版本
        function getBrowserVersion() {
            const ua = navigator.userAgent;
            let match;
            
            if (ua.includes('Edg/')) {
                match = ua.match(/Edg\/(\d+\.\d+)/);
            } else if (ua.includes('Chrome/')) {
                match = ua.match(/Chrome\/(\d+\.\d+)/);
            } else if (ua.includes('Firefox/')) {
                match = ua.match(/Firefox\/(\d+\.\d+)/);
            } else if (ua.includes('Safari/')) {
                match = ua.match(/Version\/(\d+\.\d+)/);
            } else if (ua.includes('OPR/')) {
                match = ua.match(/OPR\/(\d+\.\d+)/);
            }
            
            return match ? match[1] : '未知';
        }
        
        // 显示信息
        function displayInfo(data) {
            const resultDiv = document.getElementById('result');
            let html = '';
            
            if (data.browser) {
                html += `
                    <div class="info-section">
                        <h3>🌐 浏览器信息</h3>
                        ${createInfoItem('浏览器', data.browser.name)}
                        ${createInfoItem('版本', data.browser.version)}
                        ${createInfoItem('平台', data.browser.platform)}
                        ${createInfoItem('语言', data.browser.language)}
                        ${createInfoItem('支持语言', data.browser.languages)}
                        ${createInfoItem('Cookie', data.browser.cookieEnabled)}
                        ${createInfoItem('网络状态', data.browser.onLine)}
                        ${createInfoItem('追踪保护', data.browser.doNotTrack)}
                    </div>
                `;
            }
            
            if (data.hardware) {
                html += `
                    <div class="info-section">
                        <h3>⚙️ 硬件信息</h3>
                        ${createInfoItem('CPU核心数', data.hardware.cpuCores + ' 核')}
                        ${createInfoItem('设备内存', data.hardware.deviceMemory)}
                        ${createInfoItem('触摸支持', data.hardware.touchSupport)}
                        ${createInfoItem('最大触控点', data.hardware.maxTouchPoints)}
                    </div>
                `;
            }
            
            if (data.screen) {
                html += `
                    <div class="info-section">
                        <h3>🖥️ 屏幕信息</h3>
                        ${createInfoItem('屏幕分辨率', data.screen.resolution)}
                        ${createInfoItem('可用分辨率', data.screen.availableResolution)}
                        ${createInfoItem('视口大小', data.screen.viewport)}
                        ${createInfoItem('像素比率', data.screen.devicePixelRatio)}
                        ${createInfoItem('颜色深度', data.screen.colorDepth)}
                        ${createInfoItem('像素深度', data.screen.pixelDepth)}
                        ${createInfoItem('屏幕方向', data.screen.orientation)}
                    </div>
                `;
            }
            
            if (data.network) {
                html += `
                    <div class="info-section">
                        <h3>🌍 网络信息</h3>
                        ${createInfoItem('连接状态', data.network.onLine)}
                `;
                
                if (data.network.effectiveType) {
                    html += `
                        ${createInfoItem('网络类型', data.network.effectiveType)}
                        ${createInfoItem('下行速度', data.network.downlink)}
                        ${createInfoItem('往返延迟', data.network.rtt)}
                        ${createInfoItem('省流模式', data.network.saveData)}
                    `;
                }
                
                if (data.network.timezone) {
                    html += `${createInfoItem('时区', data.network.timezone)}`;
                }
                
                html += `</div>`;
            }
            
            if (data.time) {
                html += `
                    <div class="info-section">
                        <h3>⏰ 时间信息</h3>
                        ${createInfoItem('本地时间', data.time.localTime)}
                        ${createInfoItem('ISO时间', data.time.isoTime)}
                        ${createInfoItem('时间戳', data.time.timestamp)}
                        ${createInfoItem('时区偏移', data.time.timezoneOffset)}
                    </div>
                `;
            }
            
            html += '<button class="copy-btn" onclick="copyAllInfo()">📋 复制全部信息</button>';
            
            resultDiv.innerHTML = html;
            
            // 保存数据用于复制
            window.currentInfo = data;
        }
        
        // 创建信息项
        function createInfoItem(label, value) {
            return `
                <div class="info-item">
                    <span class="info-label">${label}:</span>
                    <span class="info-value">${escapeHtml(String(value))}</span>
                </div>
            `;
        }
        
        // 复制全部信息
        function copyAllInfo() {
            if (!window.currentInfo) return;
            
            let text = '系统信息\n' + '='.repeat(50) + '\n\n';
            text += JSON.stringify(window.currentInfo, null, 2);
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = event.target;
                const originalText = btn.textContent;
                btn.textContent = '✓ 已复制';
                btn.classList.add('copied');
                
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                alert('复制失败: ' + err);
            });
        }
        
        // HTML转义
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
        
        // 页面加载时自动获取全部信息
        window.addEventListener('load', () => {
            getSystemInfo();
        });
    </script>
</body>
</html>
